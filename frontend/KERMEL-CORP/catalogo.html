<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KERMEL CORP | Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="view/styles.css" />
  </head>
  <body class="catalog-body">
    <header class="catalog-header">
      <div class="auth-brand">
        <div class="brand-logo">K</div>
        <div>
          <p class="brand-subtitle">Catálogo</p>
          <h1>KERMEL CORP</h1>
        </div>
      </div>
    </header>

    <main class="catalog-layout">
      <!-- Panel de filtros -->
      <aside class="filters-panel" aria-label="Filtros de productos">
        <div class="filters-top">
          <h2>Filtros</h2>
          <button id="clearFilters" class="link-btn" type="button">Limpiar</button>
        </div>

        <div class="input-group">
          <label for="filterCategory">Categoría</label>
          <select id="filterCategory"></select>
        </div>

        <div class="input-group">
          <label for="filterBrand">Marca</label>
          <select id="filterBrand"></select>
        </div>

        <div class="input-group">
          <label for="filterSocket">Socket</label>
          <select id="filterSocket"></select>
        </div>

        <div class="input-group">
          <label>Precio (COP)</label>
          <div class="price-row">
            <input id="filterMinPrice" type="number" min="0" step="10000" placeholder="Mínimo" />
            <input id="filterMaxPrice" type="number" min="0" step="10000" placeholder="Máximo" />
          </div>
        </div>
      </aside>

      <!-- Productos -->
      <section class="catalog-content" aria-label="Lista de productos">
        <div class="catalog-toolbar">
          <h2>Productos</h2>
          <p id="resultsCount" class="results-count" aria-live="polite"></p>
        </div>

        <div id="productGrid" class="product-grid"></div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">🔍</div>
          <h3>Sin resultados</h3>
          <p>No encontramos productos con esos filtros. Prueba cambiándolos o toca "Limpiar".</p>
        </div>
      </section>
    </main>

    <script src="model/ProductModel.js"></script>
    <script src="view/CatalogView.js"></script>
    <script src="controller/CatalogController.js"></script>
  </body>
</html>
