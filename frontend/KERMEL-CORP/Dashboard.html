<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard en tiempo real</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #fff; --texto: #1b2733; --suave: #6b7a89; --linea: #e1e6eb;
    --lateral: #14313b; --acento: #0f9d8a; --acento2: #e8a33d; --alerta: #d8504d;
    --nuevo: rgba(15,157,138,.18);
  }
  body.oscuro {
    --bg: #0e1a20; --panel: #172830; --texto: #e6eef2; --suave: #93a6b2; --linea: #264049;
    --lateral: #0a1317; --nuevo: rgba(15,157,138,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--texto); display: flex; min-height: 100vh; }
  aside { width: 220px; background: var(--lateral); color: #dfe9ec; padding: 24px 16px; flex-shrink: 0; }
  aside h2 { font-size: 18px; margin: 0 0 24px 8px; }
  aside a { display: block; padding: 10px 12px; border-radius: 8px; color: inherit; text-decoration: none; margin-bottom: 4px; font-size: 15px; }
  aside a:hover, aside a.activo { background: rgba(255,255,255,.1); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--acento2); outline-offset: 2px; }

  .contenido { flex: 1; min-width: 0; padding: 24px 28px 40px; }
  .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .barra h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .controles { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); color: var(--texto); cursor: pointer; }
  button:hover { border-color: var(--acento); }

  .vivo { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--suave); }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--suave); }
  .vivo.activo { color: var(--acento); }
  .vivo.activo .punto { background: var(--acento); animation: latido 1.4s infinite; }
  .vivo.error { color: var(--alerta); }
  .vivo.error .punto { background: var(--alerta); }
  @keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(15,157,138,.6); } 100% { box-shadow: 0 0 0 10px rgba(15,157,138,0); } }

  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 18px; }
  .tarjeta span { color: var(--suave); font-size: 14px; }
  .tarjeta strong { display: block; font-size: 30px; margin: 6px 0 0; font-variant-numeric: tabular-nums; }

  .graficos { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 18px; min-width: 0; }
  .panel h3 { margin: 0 0 12px; font-size: 16px; }
  .caja-grafico { position: relative; height: 280px; }

  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  th { color: var(--suave); font-weight: 600; }
  td { font-variant-numeric: tabular-nums; }
  tr.nuevo { animation: resaltar 2.5s ease-out; }
  @keyframes resaltar { from { background: var(--nuevo); } to { background: transparent; } }
  .estado { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .e-pagado { background: rgba(15,157,138,.15); color: var(--acento); }
  .e-pendiente { background: rgba(232,163,61,.2); color: #b57614; }
  .e-cancelado { background: rgba(216,80,77,.15); color: var(--alerta); }
  body.oscuro .e-pendiente { color: var(--acento2); }
  .vacio { text-align: center; color: var(--suave); padding: 24px; white-space: normal; }

  @media (prefers-reduced-motion: reduce) { .punto, tr.nuevo { animation: none !important; } }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    aside { width: 100%; padding: 12px 16px; display: flex; gap: 8px; align-items: center; overflow-x: auto; }
    aside h2 { margin: 0 12px 0 0; white-space: nowrap; }
    aside a { margin: 0; white-space: nowrap; }
    .graficos { grid-template-columns: 1fr; }
    .contenido { padding: 16px; }
  }
</style>
</head>
<body>

<aside>
  <h2>KERMEL CORP</h2>
  <a href="#resumen" class="activo">Resumen</a>
  <a href="#graficos">Gráficos</a>
  <a href="#pedidos">Pedidos</a>
</aside>

<main class="contenido">
  <div class="barra">
    <h1>Ventas en vivo <span id="estadoConexion" class="vivo"><span class="punto"></span><span id="textoConexion">Sin conexión a datos</span></span></h1>
    <div class="controles">
      <button id="btnPausa" type="button">Pausar</button>
      <button id="btnOscuro" type="button">Modo oscuro</button>
    </div>
  </div>

  <section id="resumen" class="tarjetas" aria-label="Resumen"></section>

  <section id="graficos" class="graficos">
    <div class="panel">
      <h3>Ventas de los últimos 2 minutos</h3>
      <div class="caja-grafico"><canvas id="grafLinea"></canvas></div>
    </div>
    <div class="panel">
      <h3>Ventas por categoría</h3>
      <div class="caja-grafico"><canvas id="grafDona"></canvas></div>
    </div>
  </section>

  <section id="pedidos" class="panel">
    <h3>Últimos pedidos</h3>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr><th>Hora</th><th>Cliente</th><th>Producto</th><th>Categoría</th><th>Total</th><th>Estado</th></tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script>

const CONFIG = {
  modo: "ninguno",
  url: "https://tu-servidor.com/api/pedidos",            // pedidos nuevos (polling, sse) o wss://... (websocket)
  urlHistorial: "https://tu-servidor.com/api/pedidos/recientes", // opcional: pedidos ya guardados al abrir la página
  cadaMs: 5000,          // frecuencia del polling
  maxPedidos: 500,       // pedidos que se guardan en memoria
  filasTabla: 12,        // pedidos visibles en la tabla
  bloqueSegundos: 5,     // cada cuánto avanza el gráfico de líneas
  bloques: 24            // puntos del gráfico (24 x 5 s = 2 min)
};

/* =====================================================
   ESTADO
   ===================================================== */
let pedidos = [];
let pausado = false;
let serie = Array(CONFIG.bloques).fill(0);
let etiquetas = Array(CONFIG.bloques).fill("");

const moneda = n => n.toLocaleString("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const hora = d => d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const coloresCat = ["#0f9d8a", "#e8a33d", "#4a7bd0", "#d8504d", "#8a6fc9"];

/* =====================================================
   PUNTO ÚNICO DE ENTRADA DE DATOS
   Cada pedido que llegue de tu base de datos pasa por aquí.
   Campos: id, fecha (opcional), cliente, producto, categoria, total, estado
   enVivo = false -> es historial: se muestra pero no suma al gráfico de "ahora"
   ===================================================== */
function recibirPedido(datos, enVivo = true) {
  if (datos.id != null && pedidos.some(p => p.id === datos.id)) return; // evita duplicados
  const p = {
    id: datos.id ?? null,
    fecha: datos.fecha ? new Date(datos.fecha) : new Date(),
    cliente: datos.cliente,
    producto: datos.producto,
    categoria: datos.categoria,
    total: Number(datos.total) || 0,
    estado: datos.estado || "Pagado",
    nuevo: enVivo
  };
  pedidos.push(p);
  pedidos.sort((a, b) => b.fecha - a.fecha);
  if (pedidos.length > CONFIG.maxPedidos) pedidos.length = CONFIG.maxPedidos;
  if (enVivo && p.estado !== "Cancelado") serie[serie.length - 1] += p.total;
  refrescar();
}

/* =====================================================
   CONEXIÓN A TUS DATOS
   Tu servidor debe responder JSON (un objeto o una lista) con:
   { id, fecha, cliente, producto, categoria, total, estado }
   ===================================================== */
async function cargarHistorial() {
  if (!CONFIG.urlHistorial) return;
  try {
    const r = await fetch(CONFIG.urlHistorial);
    if (!r.ok) throw new Error(r.status);
    [].concat(await r.json()).forEach(p => recibirPedido(p, false));
  } catch (e) { /* si falla, el dashboard arranca vacío */ }
}

function conectarPolling() {
  let ultimoId = 0;
  const consultar = async () => {
    if (pausado) return;
    try {
      const r = await fetch(CONFIG.url + "?desde=" + ultimoId);
      if (!r.ok) throw new Error(r.status);
      [].concat(await r.json()).forEach(p => {
        recibirPedido(p);
        if (p.id > ultimoId) ultimoId = p.id;
      });
      marcarConexion("activo", "En vivo");
    } catch (e) { marcarConexion("error", "Sin conexión"); }
  };
  consultar();
  setInterval(consultar, CONFIG.cadaMs);
}

function conectarSSE() {
  const es = new EventSource(CONFIG.url);
  es.onopen = () => marcarConexion("activo", "En vivo");
  es.onerror = () => marcarConexion("error", "Reconectando…");
  es.onmessage = ev => { if (!pausado) [].concat(JSON.parse(ev.data)).forEach(p => recibirPedido(p)); };
}

function conectarWebSocket() {
  const ws = new WebSocket(CONFIG.url);
  ws.onopen = () => marcarConexion("activo", "En vivo");
  ws.onclose = () => { marcarConexion("error", "Desconectado"); setTimeout(conectarWebSocket, 3000); };
  ws.onmessage = ev => { if (!pausado) [].concat(JSON.parse(ev.data)).forEach(p => recibirPedido(p)); };
}

function marcarConexion(clase, texto) {
  document.getElementById("estadoConexion").className = "vivo " + clase;
  document.getElementById("textoConexion").textContent = texto;
}

/* =====================================================
   TARJETAS
   ===================================================== */
function resumen() {
  const validos = pedidos.filter(p => p.estado !== "Cancelado");
  const ventas = validos.reduce((a, p) => a + p.total, 0);
  const clientes = new Set(validos.map(p => p.cliente)).size;
  const ticket = validos.length ? ventas / validos.length : 0;
  const hace1min = Date.now() - 60000;
  const porMinuto = pedidos.filter(p => p.fecha.getTime() >= hace1min).length;

  const datos = [
    ["Ventas acumuladas", moneda(ventas)],
    ["Pedidos válidos", validos.length],
    ["Clientes distintos", clientes],
    ["Ticket promedio", moneda(ticket)],
    ["Pedidos último minuto", porMinuto]
  ];
  document.getElementById("resumen").innerHTML = datos.map(([t, v]) =>
    `<div class="tarjeta"><span>${t}</span><strong>${v}</strong></div>`).join("");
}

/* =====================================================
   GRÁFICOS
   ===================================================== */
let grafLinea, grafDona;

function colores() {
  const oscuro = document.body.classList.contains("oscuro");
  Chart.defaults.color = oscuro ? "#93a6b2" : "#6b7a89";
  Chart.defaults.borderColor = oscuro ? "#264049" : "#e1e6eb";
}

function crearGraficos() {
  colores();
  if (grafLinea) grafLinea.destroy();
  if (grafDona) grafDona.destroy();

  grafLinea = new Chart(document.getElementById("grafLinea"), {
    type: "line",
    data: { labels: etiquetas, datasets: [{
      label: "Ventas", data: serie, borderColor: "#0f9d8a",
      backgroundColor: "rgba(15,157,138,.15)", fill: true, tension: .3, pointRadius: 2
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => moneda(c.parsed.y) } } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => "$" + Math.round(v / 1000) + "k" } },
                x: { ticks: { maxTicksLimit: 6 } } }
    }
  });

  grafDona = new Chart(document.getElementById("grafDona"), {
    type: "doughnut",
    data: { labels: [], datasets: [{ data: [], backgroundColor: coloresCat, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: "62%", animation: { duration: 400 },
      plugins: { legend: { position: "bottom" }, tooltip: { callbacks: { label: c => c.label + ": " + moneda(c.parsed) } } }
    }
  });
  actualizarGraficos();
}

function actualizarGraficos() {
  grafLinea.update();
  const porCat = {};
  pedidos.filter(p => p.estado !== "Cancelado")
         .forEach(p => porCat[p.categoria] = (porCat[p.categoria] || 0) + p.total);
  grafDona.data.labels = Object.keys(porCat);
  grafDona.data.datasets[0].data = Object.values(porCat);
  grafDona.update();
}

// Cada 5 s el gráfico de líneas avanza un bloque de tiempo
setInterval(() => {
  if (pausado) return;
  serie.shift(); serie.push(0);
  etiquetas.shift(); etiquetas.push(hora(new Date()));
  resumen();
  actualizarGraficos();
}, CONFIG.bloqueSegundos * 1000);

/* =====================================================
   TABLA
   ===================================================== */
function tabla() {
  const cuerpo = document.getElementById("cuerpoTabla");
  const lista = pedidos.slice(0, CONFIG.filasTabla);
  if (!lista.length) {
    cuerpo.innerHTML = `<tr><td colspan="6" class="vacio">Aún no hay pedidos. Cuando conectes tu base de datos, aparecerán aquí en tiempo real.</td></tr>`;
    return;
  }
  cuerpo.innerHTML = lista.map(p => {
    const clase = p.nuevo ? ' class="nuevo"' : "";
    p.nuevo = false;
    return `<tr${clase}>
      <td>${hora(p.fecha)}</td>
      <td>${esc(p.cliente)}</td>
      <td>${esc(p.producto)}</td>
      <td>${esc(p.categoria)}</td>
      <td>${moneda(p.total)}</td>
      <td><span class="estado e-${esc(p.estado.toLowerCase())}">${esc(p.estado)}</span></td>
    </tr>`;
  }).join("");
}

function refrescar() { resumen(); tabla(); actualizarGraficos(); }

/* =====================================================
   CONTROLES
   ===================================================== */
const btnPausa = document.getElementById("btnPausa");
btnPausa.addEventListener("click", () => {
  pausado = !pausado;
  btnPausa.textContent = pausado ? "Reanudar" : "Pausar";
  if (CONFIG.modo !== "ninguno") marcarConexion(pausado ? "" : "activo", pausado ? "En pausa" : "En vivo");
});

document.getElementById("btnOscuro").addEventListener("click", e => {
  document.body.classList.toggle("oscuro");
  e.target.textContent = document.body.classList.contains("oscuro") ? "Modo claro" : "Modo oscuro";
  crearGraficos();
});

document.querySelectorAll("aside a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll("aside a").forEach(x => x.classList.remove("activo"));
  a.classList.add("activo");
}));

/* =====================================================
   ARRANQUE
   ===================================================== */
etiquetas[etiquetas.length - 1] = hora(new Date());
crearGraficos();
refrescar();

if (CONFIG.modo !== "ninguno") cargarHistorial();
if (CONFIG.modo === "polling") conectarPolling();
else if (CONFIG.modo === "sse") conectarSSE();
else if (CONFIG.modo === "websocket") conectarWebSocket();
</script>
</body>
</html>
