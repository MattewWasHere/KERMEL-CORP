<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de inventario</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #fff; --texto: #1b2733; --suave: #6b7a89; --linea: #e1e6eb;
    --lateral: #14313b; --acento: #0f9d8a; --acento2: #e8a33d; --alerta: #d8504d;
    --nuevo: rgba(15,157,138,.18);
  }
  body.oscuro {
    --bg: #0e1a20; --panel: #172830; --texto: #e6eef2; --suave: #93a6b2; --linea: #264049;
    --lateral: #0a1317; --nuevo: rgba(15,157,138,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--texto); display: flex; min-height: 100vh; }
  aside { width: 220px; background: var(--lateral); color: #dfe9ec; padding: 24px 16px; flex-shrink: 0; }
  aside h2 { font-size: 18px; margin: 0 0 24px 8px; }
  aside a { display: block; padding: 10px 12px; border-radius: 8px; color: inherit; text-decoration: none; margin-bottom: 4px; font-size: 15px; }
  aside a:hover, aside a.activo { background: rgba(255,255,255,.1); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--acento2); outline-offset: 2px; }

  .contenido { flex: 1; min-width: 0; padding: 24px 28px 40px; }
  .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .barra h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .controles { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); color: var(--texto); cursor: pointer; }
  button:hover { border-color: var(--acento); }

  .vivo { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--suave); }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--suave); }
  .vivo.activo { color: var(--acento); }
  .vivo.activo .punto { background: var(--acento); animation: latido 1.4s infinite; }
  .vivo.error { color: var(--alerta); }
  .vivo.error .punto { background: var(--alerta); }
  @keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(15,157,138,.6); } 100% { box-shadow: 0 0 0 10px rgba(15,157,138,0); } }

  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 18px; }
  .tarjeta span { color: var(--suave); font-size: 14px; }
  .tarjeta strong { display: block; font-size: 30px; margin: 6px 0 0; font-variant-numeric: tabular-nums; }

  .graficos { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 18px; min-width: 0; }
  .panel h3 { margin: 0 0 12px; font-size: 16px; }
  .caja-grafico { position: relative; height: 280px; }

  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  th { color: var(--suave); font-weight: 600; }
  td { font-variant-numeric: tabular-nums; }
  tr.nuevo { animation: resaltar 2.5s ease-out; }
  @keyframes resaltar { from { background: var(--nuevo); } to { background: transparent; } }
  .estado { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .e-pagado { background: rgba(15,157,138,.15); color: var(--acento); }
  .e-pendiente { background: rgba(232,163,61,.2); color: #b57614; }
  .e-cancelado { background: rgba(216,80,77,.15); color: var(--alerta); }
  body.oscuro .e-pendiente { color: var(--acento2); }
  .vacio { text-align: center; color: var(--suave); padding: 24px; white-space: normal; }

  @media (prefers-reduced-motion: reduce) { .punto, tr.nuevo { animation: none !important; } }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    aside { width: 100%; padding: 12px 16px; display: flex; gap: 8px; align-items: center; overflow-x: auto; }
    aside h2 { margin: 0 12px 0 0; white-space: nowrap; }
    aside a { margin: 0; white-space: nowrap; }
    .graficos { grid-template-columns: 1fr; }
    .contenido { padding: 16px; }
  }
</style>
</head>
<body>

<aside>
  <h2>KERMEL CORP</h2>
  <a href="#resumen" class="activo">Resumen</a>
  <a href="#graficos">Gráficos</a>
  <a href="#productos">Productos</a>
</aside>

<main class="contenido">
  <div class="barra">
    <h1>Inventario <span id="estadoConexion" class="vivo"><span class="punto"></span><span id="textoConexion">Cargando productos...</span></span></h1>
    <div class="controles">
      <button id="btnPausa" type="button">Pausar</button>
      <button id="btnOscuro" type="button">Modo oscuro</button>
    </div>
  </div>

  <section id="resumen" class="tarjetas" aria-label="Resumen"></section>

  <section id="graficos" class="graficos">
    <div class="panel">
      <h3>Existencias por categoría</h3>
      <div class="caja-grafico"><canvas id="grafLinea"></canvas></div>
    </div>
    <div class="panel">
      <h3>Productos por categoría</h3>
      <div class="caja-grafico"><canvas id="grafDona"></canvas></div>
    </div>
  </section>

  <section id="productos" class="panel">
    <h3>Productos precargados</h3>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr><th>Producto</th><th>Marca</th><th>Categoría</th><th>Precio</th><th>Existencias</th><th>Estado</th></tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script>
const CONFIG = {
  urlProductos: "http://127.0.0.1:8000/api/products",
  cadaMs: 30000
};

let productos = [];
let pausado = false;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const coloresCat = ["#0f9d8a", "#e8a33d", "#4a7bd0", "#d8504d", "#8a6fc9"];

function marcarConexion(clase, texto) {
  document.getElementById("estadoConexion").className = "vivo " + clase;
  document.getElementById("textoConexion").textContent = texto;
}

function resumen() {
  const categorias = new Set(productos.map(p => p.category)).size;
  const existencias = productos.reduce((total, p) => total + Number(p.stock || 0), 0);
  const valor = productos.reduce((total, p) => total + Number(p.price || 0) * Number(p.stock || 0), 0);
  const agotados = productos.filter(p => Number(p.stock || 0) <= 0).length;
  const datos = [
    ["Productos", productos.length.toLocaleString("es-CO")],
    ["Categorías", categorias.toLocaleString("es-CO")],
    ["Unidades disponibles", existencias.toLocaleString("es-CO")],
    ["Valor del inventario", moneda(valor)],
    ["Productos agotados", agotados.toLocaleString("es-CO")]
  ];
  document.getElementById("resumen").innerHTML = datos.map(([t, v]) =>
    `<div class="tarjeta"><span>${t}</span><strong>${v}</strong></div>`).join("");
}

let grafLinea, grafDona;

function colores() {
  const oscuro = document.body.classList.contains("oscuro");
  Chart.defaults.color = oscuro ? "#93a6b2" : "#6b7a89";
  Chart.defaults.borderColor = oscuro ? "#264049" : "#e1e6eb";
}

function crearGraficos() {
  colores();
  if (grafLinea) grafLinea.destroy();
  if (grafDona) grafDona.destroy();

  grafLinea = new Chart(document.getElementById("grafLinea"), {
    type: "bar",
    data: { labels: [], datasets: [{
      label: "Unidades disponibles", data: [], backgroundColor: coloresCat, borderRadius: 5
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });

  grafDona = new Chart(document.getElementById("grafDona"), {
    type: "doughnut",
    data: { labels: [], datasets: [{ data: [], backgroundColor: coloresCat, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: "62%", animation: { duration: 400 },
      plugins: { legend: { position: "bottom" } }
    }
  });
  actualizarGraficos();
}

function actualizarGraficos() {
  if (!grafLinea || !grafDona) return;
  const porCategoria = {};
  productos.forEach(p => {
    if (!porCategoria[p.category]) porCategoria[p.category] = { productos: 0, stock: 0 };
    porCategoria[p.category].productos += 1;
    porCategoria[p.category].stock += Number(p.stock || 0);
  });
  const categorias = Object.keys(porCategoria);
  grafLinea.data.labels = categorias;
  grafLinea.data.datasets[0].data = categorias.map(categoria => porCategoria[categoria].stock);
  grafDona.data.labels = categorias;
  grafDona.data.datasets[0].data = categorias.map(categoria => porCategoria[categoria].productos);
  grafLinea.update();
  grafDona.update();
}

function tabla() {
  const cuerpo = document.getElementById("cuerpoTabla");
  if (!productos.length) {
    cuerpo.innerHTML = `<tr><td colspan="6" class="vacio">El JSON no contiene productos.</td></tr>`;
    return;
  }
  cuerpo.innerHTML = productos.map(producto => {
    const stock = Number(producto.stock || 0);
    const estado = stock > 0 ? "Disponible" : "Agotado";
    const claseEstado = stock > 0 ? "e-pagado" : "e-cancelado";
    return `<tr>
      <td>${esc(producto.icon || "")} ${esc(producto.name)}</td>
      <td>${esc(producto.brand)}</td>
      <td>${esc(producto.category)}</td>
      <td>${moneda(Number(producto.price || 0))}</td>
      <td>${stock.toLocaleString("es-CO")}</td>
      <td><span class="estado ${claseEstado}">${estado}</span></td>
    </tr>`;
  }).join("");
}

function refrescar() { resumen(); tabla(); actualizarGraficos(); }

const moneda = n => n.toLocaleString("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });

async function cargarProductos() {
  try {
    const respuesta = await fetch(CONFIG.urlProductos);
    if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
    const datos = await respuesta.json();
    if (!Array.isArray(datos)) throw new Error("La API no devolvió una lista de productos.");
    productos = datos;
    refrescar();
    marcarConexion("activo", "Datos cargados");
  } catch (error) {
    marcarConexion("error", "Error al cargar productos");
    document.getElementById("cuerpoTabla").innerHTML =
      `<tr><td colspan="6" class="vacio">No se pudieron cargar los productos. Verifica que la API esté activa en http://127.0.0.1:8000 y vuelve a intentar.</td></tr>`;
    console.error("No se pudo cargar el inventario:", error);
  }
}

const btnPausa = document.getElementById("btnPausa");
btnPausa.addEventListener("click", () => {
  pausado = !pausado;
  btnPausa.textContent = pausado ? "Reanudar" : "Pausar";
  marcarConexion(pausado ? "" : "activo", pausado ? "Actualización pausada" : "Actualizando");
});

document.getElementById("btnOscuro").addEventListener("click", e => {
  document.body.classList.toggle("oscuro");
  e.target.textContent = document.body.classList.contains("oscuro") ? "Modo claro" : "Modo oscuro";
  crearGraficos();
});

document.querySelectorAll("aside a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll("aside a").forEach(x => x.classList.remove("activo"));
  a.classList.add("activo");
}));

crearGraficos();
refrescar();
cargarProductos();
setInterval(() => {
  if (!pausado) cargarProductos();
}, CONFIG.cadaMs);
</script>
</body>
</html>
