<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KERMEL CORP | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="view/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-brand">
        <div class="brand-logo">K</div>
        <div>
          <p class="brand-subtitle">Distribución tecnológica</p>
          <h1>KERMEL CORP</h1>
        </div>
      </header>

      <p class="brand-copy">
        Soluciones en componentes y dispositivos tecnológicos para tu negocio.
      </p>

      <section class="auth-card" aria-label="Inicio de sesión de usuarios">
        <h2>Iniciar sesión</h2>

        <form id="loginForm" novalidate>
          <div class="input-group">
            <label for="username">Usuario o correo</label>
            <input id="username" name="username" type="text" placeholder="ej. admin@kermelcorp.com" />
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="Ingrese su contraseña" />
          </div>

          <button type="submit" class="primary-btn">Entrar</button>
          <div id="message" class="message" aria-live="polite"></div>
        </form>

        <div class="auth-links">
          <a href="register.html">Crear una cuenta nueva</a>
        </div>
      </section>
    </main>

    <script src="model/UserModel.js"></script>
    <script src="view/AuthView.js"></script>
    <script src="controller/AuthController.js"></script>
    <script src="controller/app.js"></script>
  </body>
</html>
