<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KERMEL CORP | Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="view/styles.css?v=2" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-brand">
        <div class="brand-logo">K</div>
        <div>
          <p class="brand-subtitle">Nueva cuenta</p>
          <h1>KERMEL CORP</h1>
        </div>
      </header>

      <p class="brand-copy">Crea tu cuenta para acceder a nuestros servicios tecnológicos.</p>

      <section class="auth-card" aria-label="Crear nueva cuenta">
        <h2>Crear cuenta</h2>

        <form id="registerForm">
          <div class="input-group">
            <label for="name">Nombre completo</label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required />
          </div>

          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required />
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
          </div>

          <div class="input-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
          </div>

          <button type="submit" class="primary-btn">Registrar</button>
          <div id="registerMessage" class="message" aria-live="polite"></div>
        </form>

        <div class="auth-links">
          <a href="index.html">Ya tengo cuenta</a>
        </div>
      </section>
    </main>

    <script src="controller/api-config.js"></script>
    <script src="model/UserModel.js"></script>
    <script src="view/AuthView.js"></script>
    <script src="controller/AuthController.js"></script>
    <script src="controller/app.js"></script>
  </body>
</html>
