<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KERMEL CORP | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="view/styles.css?v=2" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-brand">
        <div class="brand-logo">K</div>
        <div>
          <p class="brand-subtitle">Panel administrativo</p>
          <h1>KERMEL CORP</h1>
        </div>
      </header>

      <p class="brand-copy">Acceso exclusivo para administración y control del sistema.</p>

      <section class="auth-card" aria-label="Inicio de sesión administrador">
        <h2>Administrador</h2>

        <form id="adminLoginForm">
          <div class="input-group">
            <label for="username">Usuario administrador</label>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="254" required />
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required />
          </div>

          <button type="submit" class="primary-btn">Entrar</button>
          <div id="adminMessage" class="message" aria-live="polite"></div>
        </form>

        <div class="auth-links">
          <a href="index.html">Volver al login</a>
        </div>
      </section>
    </main>

    <script src="controller/api-config.js"></script>
    <script src="model/UserModel.js"></script>
    <script src="view/AuthView.js"></script>
    <script src="controller/AuthController.js"></script>
    <script src="controller/app.js"></script>
  </body>
</html>
